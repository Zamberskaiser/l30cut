[package]
name = "l30-cut-ai"
version = "0.1.1"
description = "L30 CUT AI desktop shell"
edition = "2021"
rust-version = "1.77"

[lib]
name = "l30_cut_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# SECURITY: no shell plugin. AI operations cross IPC only through the
# allowlisted, typed validation in src/ai_ops.rs — never free-form strings.
[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.32"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

[features]
default = []
